<!-- Daily Tasks Section -->
<div class="tasks-container" style="margin-top: 20px; padding: 15px; background: #1e293b; border-radius: 12px; color: #fff;">
  <h3 style="margin-bottom: 10px; font-size: 1.1rem; text-align: center;">⚡ Daily Rewards & Tasks</h3>
  
  <!-- Daily Claim Button -->
  <div class="task-card" style="display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 12px; border-radius: 8px; margin-bottom: 10px;">
    <div>
      <strong style="display: block;">📅 Daily Login Bonus</strong>
      <small style="color: #94a3b8;">+100 MINE every 24 hrs</small>
    </div>
    <button id="claimDailyBtn" onclick="claimDailyReward()" style="background: #22c55e; color: #fff; border: none; padding: 8px 14px; border-radius: 6px; font-weight: bold; cursor: pointer;">Claim</button>
  </div>

  <!-- Social Task 1 -->
  <div class="task-card" style="display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 12px; border-radius: 8px; margin-bottom: 10px;">
    <div>
      <strong style="display: block;">📢 Join Telegram Channel</strong>
      <small style="color: #94a3b8;">+500 MINE</small>
    </div>
    <a href="https://t.me" target="_blank" onclick="completeTask(this, 500)" style="background: #3b82f6; color: #fff; text-decoration: none; padding: 8px 14px; border-radius: 6px; font-weight: bold;">Start</a>
  </div>

  <!-- Social Task 2 -->
  <div class="task-card" style="display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 12px; border-radius: 8px;">
    <div>
      <strong style="display: block;">🚀 Follow Community Page</strong>
      <small style="color: #94a3b8;">+300 MINE</small>
    </div>
    <a href="https://twitter.com" target="_blank" onclick="completeTask(this, 300)" style="background: #3b82f6; color: #fff; text-decoration: none; padding: 8px 14px; border-radius: 6px; font-weight: bold;">Start</a>
  </div>
</div>
